[project]
name = "awesomecloset"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    # Database
    "sqlmodel==0.0.21",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg>=0.30.0",
    "alembic==1.13.3",
    # Config & validation
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    # Background jobs
    "arq==0.26.1",
    "redis==5.1.1",
    # AI
    "google-generativeai==0.8.3",
    # Background removal
    "rembg==2.0.57",
    "pillow==10.4.0",
    # HTTP client
    "httpx==0.27.2",
    # Auth (Supabase JWT)
    "python-jose[cryptography]==3.3.0",
    # Rate limiting
    "slowapi==0.1.9",
    # Logging
    "loguru==0.7.2",
    # File upload
    "python-multipart==0.0.12",
]

[dependency-groups]
dev = [
    "ruff==0.6.9",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "testcontainers[postgres]==4.8.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
