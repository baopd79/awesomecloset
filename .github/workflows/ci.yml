name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci-backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest
    if: |
      contains(toJson(github.event.pull_request.files.*.filename), 'backend/') ||
      contains(toJson(github.event.pull_request.files.*.filename), 'tests/')

    services:
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check backend/

      - name: Test (pytest)
        env:
          REDIS_URL: redis://localhost:6379
          SUPABASE_URL: http://localhost
          SUPABASE_ANON_KEY: test
          SUPABASE_SERVICE_ROLE_KEY: test
          GEMINI_API_KEY: test
          GEMINI_TAGGING_MODEL: gemini-2.0-flash
          GEMINI_SUGGESTION_MODEL: gemini-2.0-flash
          OPENWEATHERMAP_API_KEY: test
          SECRET_KEY: test-secret-key-minimum-32-characters
          APP_ENV: test
        run: uv run pytest tests/ --tb=short -q

  ci-mobile:
    name: Mobile — typecheck + lint
    runs-on: ubuntu-latest
    if: contains(toJson(github.event.pull_request.files.*.filename), 'mobile/')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: mobile

      - name: Lint (ESLint)
        run: npx eslint .
        working-directory: mobile
